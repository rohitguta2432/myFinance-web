version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -e NEXT_PUBLIC_GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e BACKEND_URL -e ADMIN_USERNAME -e ADMIN_PASSWORD -e BEDROCK_REGION -e BEDROCK_ACCESS_KEY_ID -e BEDROCK_SECRET_ACCESS_KEY -e DYNAMODB_ACCESS_KEY_ID -e DYNAMODB_SECRET_ACCESS_KEY -e MYAPP_AWS_REGION -e CRON_SECRET >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
